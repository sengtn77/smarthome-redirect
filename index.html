<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Returning to SmartHome…</title>
<p style="font: 16px system-ui; padding: 24px">Returning to the SmartHome app…</p>
<script type="module">
  import { resolveTarget } from './src/redirect.js';
  // eWelink redirects here with ?code=…&region=…&state=…  (state is JSON set by the app: {r: returnUrl, n: nonce}).
  // Forward the whole query string to the app's deep link. Only known app schemes are allowed.
  (() => {
    try {
      const target = resolveTarget(location.search);
      if (target !== null) {
        location.replace(target);
        return;
      }
    } catch (e) {}
    document.body.textContent = 'Invalid login response.';
  })();
</script>
